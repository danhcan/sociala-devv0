version: '3.9'

services:
  socialai-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: socialai-dashboard:latest
    container_name: socialai-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env.local   # Sao chep .env.example -> .env.local roi dien bien
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
